name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Protocol tests with coverage gates
        run: npm run test:coverage 2>&1 | tee coverage-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-coverage
          path: coverage-report.txt
          retention-days: 30

  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - name: Install Godot
        run: |
          curl --fail --location --output /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Room registry and game-rule regressions
        run: >-
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          --headless --path . --script res://tests/run_tests.gd
      - name: Headless project launch
        run: >-
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          --headless --path . --quit-after 2

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: prompt-heist-room-service:verify
