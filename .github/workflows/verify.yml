name: Verify

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  protocol:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - name: Protocol tests with coverage gates
        run: |
          set -o pipefail
          npm run test:coverage 2>&1 | tee coverage-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: protocol-coverage
          path: coverage-report.txt
          retention-days: 30

  godot:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      GODOT_VERSION: 4.7.2
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install Godot
        run: |
          curl --fail --location --output /tmp/godot.zip "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          unzip -q /tmp/godot.zip -d /tmp/godot
          chmod +x "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
      - name: Registry, game-rule, protocol-client, and UI-state tests
        run: |
          set -o pipefail
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path . --script res://tests/run_tests.gd \
            2>&1 | tee godot-test-report.txt
      - name: Headless project launch
        run: >-
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64"
          --headless --path . --quit-after 2
      - name: Real Node and Godot WebSocket integration
        run: |
          npm ci
          node server/src/main.js > /tmp/prompt-heist-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:3000/healthz > /dev/null; then
              break
            fi
            sleep 0.2
          done
          curl --fail http://127.0.0.1:3000/healthz
          set -o pipefail
          TEST_WS_URL=ws://127.0.0.1:3000/ws \
            "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path . --script res://tests/network_integration_test.gd \
            2>&1 | tee godot-integration-report.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: godot-test-reports
          path: |
            godot-test-report.txt
            godot-integration-report.txt
          retention-days: 30
      - name: Install Web export template
        run: |
          mkdir -p "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
          curl --fail --location --output /tmp/godot-templates.tpz \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/Godot_v${GODOT_VERSION}-stable_export_templates.tpz"
          unzip -j /tmp/godot-templates.tpz \
            templates/version.txt templates/web_nothreads_debug.zip templates/web_nothreads_release.zip \
            -d "$HOME/.local/share/godot/export_templates/${GODOT_VERSION}.stable"
      - name: Build Web export
        run: |
          mkdir -p builds/web
          "/tmp/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64" \
            --headless --path . --export-release Web builds/web/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: prompt-heist-web
          path: builds/web
          retention-days: 14

  container:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: prompt-heist-room-service:verify
